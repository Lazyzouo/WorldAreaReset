# WorldAreaReset 官方中文默认配置
config_version: 2
language: "zh_CN"

cleanup:
  # 默认关闭，管理员确认世界和范围后再开启。
  enabled: false
  interval_minutes: 180
  countdown_seconds: 10
  world: "world_nether"

  min_x: -200
  max_x: 200
  min_y: 0
  max_y: 128
  min_z: -200
  max_z: 200

  keep_blocks:
    - BEDROCK
    - BARRIER

updates:
  enabled: true
  auto_download: true
  notify_latest: true

# Author: Lazyz | Version: 1.0.0
# Feedback: https://github.com/Lazyzouo/WorldAreaReset/issues
# This plugin uses Hex color codes. Color code lookup: https://htmlcolorcodes.com/color-picker/
# Format: <#RRGGBB>color, <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5>text</gradient>
#        <bold>bold</bold>, <italic>italic</italic>, <underlined>underline</underlined>,
#        <strikethrough>strike</strikethrough>, <obfuscated>obfuscated</obfuscated>, <br>line break
# After editing this file, run /war reload in game to reload all config.
config-version: 1
# Message language. Allowed values: zh_CN, en_US. Default: en_US.
language: "en_US"
# Language most recently applied to runtime configuration. Change language only; do not edit language-applied manually. Reload or restart after changing language.
language-applied: "en_US"

settings:
  # Permission node used by /war cleanup, /war recreate, and /war reload.
  admin-permission: "worldareareset.admin"

cleanup:
  # Ordinary cleanup settings. Keep disabled until every world and region is confirmed.
  enabled: false
  # Automatic cleanup period amount; minimum 1. Manual /war cleanup remains available.
  interval: 3
  # Interval unit: minutes, hours, or days.
  interval_unit: "hours"
  # Warning countdown before automatic or manual cleanup, in seconds.
  countdown_seconds: 10
  # One list controls every cleanup world and its inclusive cuboid regions.
  # Keep one module for one world; add modules or regions as needed.
  worlds:
    - name: "world_nether"
      regions:
        - {min_x: -200, max_x: 200, min_y: 0, max_y: 128, min_z: -200, max_z: 200}
  # Bukkit Material names preserved during cleanup; other non-air blocks are cleared.
  keep_blocks:
    - BEDROCK
    - BARRIER
  # Spherical block radius protected around every player; 2 protects two blocks.
  player_protection_radius: 2

recreate:
  # Hot restoration. Put templates under templates/<world-name>/region/.
  # Example: templates/arena_world/region/r.0.0.mca; the folder name is the target world.
  # The target world must be loaded. Templates may come from another server-generated world.
  # For first use, keep enabled false and test a small region with /war recreate.
  enabled: false
  # Automatic hot-restoration interval amount; minimum 1.
  interval: 3
  # Interval unit: hours or days.
  interval_unit: "hours"
  # Warning countdown before restoration starts, in seconds.
  countdown_seconds: 10
  # Spherical block radius protected around every player; 0 disables protection, 2 is recommended.
  player_protection_radius: 2
  # Maximum blocks written per Region tick; the same value is used with or without players.
  # Player protection is limited to nearby blocks, so players elsewhere do not throttle the restore.
  # Lower values are smoother; higher values restore faster but send more chunk update packets.
  blocks_per_tick: 4096
  # Ignore water, lava, and bubble columns saved in the template; target liquids remain unchanged.
  ignore_liquids: false
  # Bukkit Material names ignored in the template; the target block remains unchanged.
  ignore_blocks: []
  # One list controls every target world and its regions. Each name must match both the loaded
  # world and templates/<world-name>/region/. Empty regions restore every stored template chunk,
  # even when no player is online in the target world.
  worlds:
    - name: "arena_world"
      regions:
        - {min_x: -4, max_x: 4, min_y: 0, max_y: 40, min_z: -4, max_z: 4}
        - {min_x: -32, max_x: 32, min_y: 32, max_y: 40, min_z: -4, max_z: 4}
    - name: "arena_nether"
      regions:
        - {min_x: -16, max_x: 16, min_y: 0, max_y: 80, min_z: -16, max_z: 16}

updates:
  # Checks the official GitHub Releases page asynchronously at startup. Default: true.
  enabled: true

  # Downloads a newer JAR into Bukkit's update folder. It applies after another restart.
  # This setting is used only when updates.enabled is true. Default: true.
  auto-download: true

  # Prints a console notice when the installed version is already current. Default: true.

# These editable messages are not server-specific parameter presets.
messages:
  prefix: "<color:#8A2387><bold>[</bold><color:#E62028><bold>WorldAreaReset</bold></color><color:#8A2387><bold>]</bold></color> <color:#555555><bold>»</bold></color> <color:#B9E7FF>"
  plugin_enabled: "<color:#55FF55>{prefix}<bold>WorldAreaReset v{version} by {author} started successfully on Paper/Folia.</color>"
  update_checking: "<color:#00D2FF>Checking the official WorldAreaReset GitHub Release for updates.</color>"
  update_latest: "<color:#55FF55>WorldAreaReset {version} is already the latest version.</color>"
  update_available: "<color:#FFFF55>WorldAreaReset {latest} is available; the current version is {current}.</color>"
  update_downloaded: "<color:#55FF55>WorldAreaReset {version} was downloaded and passed SHA-256 verification. It will install on the next server restart.</color>"
  update_manual: "<color:#FFFF55>WorldAreaReset {version} is available. Download it from the official Releases page: {url}</color>"
  update_failed: "<color:#FF5555>WorldAreaReset automatic update failed: {reason}. Download it manually from: {url}</color>"
  reload_success: "<color:#55FF55>{prefix}<bold>Reload complete > Configuration reloaded and cleanup scheduling restarted.</color>"
  manual_cleanup_started: "<color:#FFFF55>{prefix}<bold>Cleanup queued > Countdown started; automatic cleanup timer reset to {interval}</color>"
  manual_recreate_started: "<color:#FFFF55>{prefix}<bold>Restoration queued > Countdown started; automatic restoration timer reset to {interval}</color>"
  no_permission: "<color:#FF5555>{prefix}<bold>Permission denied > You cannot use this command.</color>"
  wrong_usage: "<color:#FF5555>{prefix}<bold>Usage > Unknown command. Use /war help.</color>"
  start_cleanup: "<color:#00D2FF>{prefix}<bold>Cleanup running > Area cleanup is running in {world}. Please wait.</color>"
  start_restore: "<color:#00D2FF>{prefix}<bold>Restoration running > Terrain hot restoration is running in {world}. Please wait.</color>"
  warning: |-
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold><strikethrough>---------<bold><strikethrough>---------<bold> ✧ <bold><strikethrough>---------<bold><strikethrough>---------</gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>Terrain cleanup warning > Move away from the cleanup area.</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>World > {world}</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>Starts in > {time} seconds.</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold><strikethrough>---------<bold><strikethrough>---------<bold> ✧ <bold><strikethrough>---------<bold><strikethrough>---------</gradient>
  restore_warning: |-

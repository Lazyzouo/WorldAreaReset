      - "&6━━━━━━&e━━━━━━&a━━━━━━ &f✦ &a━━━━━━&e━━━━━━&6━━━━━━"
      - "&b ❖ &3&l{name} &7v{version} &8| &f作者: &e{author}"
      - "&6━━━━━━&e━━━━━━&a━━━━━━ &f✦ &a━━━━━━&e━━━━━━&6━━━━━━"
      - "&e ► &e&l基础指令 &e◄"
      - "  &f/war help &8- &7打开帮助菜单"
      - "&c ► &c&l管理员指令 &c◄"

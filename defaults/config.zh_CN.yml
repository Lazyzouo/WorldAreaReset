      - "  &8▪ &7全局清理周期: &a{interval} &7分钟"
      - "  &8▪ &7清理警告倒计时: &c{countdown} &7秒"
      - "&6━━━━━━&e━━━━━━&a━━━━━━ &f✦ &a━━━━━━&e━━━━━━&6━━━━━━"


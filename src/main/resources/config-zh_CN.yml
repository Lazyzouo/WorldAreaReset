# 插件作者: Lazyz | 插件版本: 1.0.0
# 问题反馈: https://github.com/Lazyzouo/WorldAreaReset/issues
# 本插件使用的是Hex颜色代码，颜色代码查询: https://htmlcolorcodes.com/color-picker/
# 格式: <#RRGGBB>颜色，<gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5>文本</gradient>
#       <bold>加粗</bold>，<italic>斜体</italic>，<underlined>下划线</underlined>，
#       <strikethrough>删除线</strikethrough>，<obfuscated>随机字符</obfuscated>，<br>换行
# 修改本文件后，可在游戏内使用 /war reload 指令热重载所有配置。
config-version: 25
# 消息语言。可选值：zh_CN、en_US。默认值：zh_CN。
language: "zh_CN"
# 最近一次已应用到运行时配置的语言。只修改 language，不要手动修改 language-applied；修改后执行 /war reload 或重启。
language-applied: "zh_CN"

settings:
  # /war cleanup、/war recreate、/war reload 使用的管理员权限节点
  admin-permission: "worldareareset.admin"

cleanup:
  # 普通清理设置。确认所有世界与区域前请保持关闭。
  enabled: false
  # 自动清理周期数值；最小为 1。手动 /war cleanup 不受此开关限制。
  interval: 3
  # 周期单位，只能使用 minutes（分钟）、hours（小时）或 days（天）。
  interval_unit: "hours"
  # 自动清理和手动清理开始前的警告倒计时，单位秒。
  countdown_seconds: 10
  # 一个列表统一控制全部清理世界及各自的包含边界长方体区域。
  # 单世界只保留一个模块；多世界或多区域时按相同格式继续添加。
  worlds:
    - name: "world_nether"
      regions:
        - {min_x: -200, max_x: 200, min_y: 0, max_y: 128, min_z: -200, max_z: 200}
  # 清理时保留的方块材质名称；其余非空气方块会被清除。
  keep_blocks:
    - BEDROCK
    - BARRIER
  # 保护每名玩家周围的球形方块半径；2 表示保护半径 2 格。
  player_protection_radius: 2

recreate:
  # 地形热恢复设置。模板必须放在 templates/<世界名>/region/。
  # 例如：templates/arena_world/region/r.0.0.mca；文件夹名就是目标世界名。
  # 目标世界必须已加载，模板可以来自服务器原生生成的另一个世界。
  # 首次使用建议保持 enabled: false，先用 /war recreate 测试小区域。
  enabled: false
  # 自动热恢复周期数值；最小为 1。
  interval: 3
  # 周期单位，只能使用 hours（小时）或 days（天）。
  interval_unit: "hours"
  # 热恢复开始前的警告倒计时，单位秒。
  countdown_seconds: 10
  # 保护每名玩家周围的球形方块半径；0 表示不保护，建议使用 2。
  player_protection_radius: 2
  # 每个 Region tick 的最大恢复方块数；该值同时适用于有玩家和无玩家世界。
  # 玩家保护只作用于玩家附近方块，不会因为玩家在世界其它位置而拖慢整次恢复。
  # 数值越小越平滑，数值越大恢复越快但会产生更多区块更新数据包。
  blocks_per_tick: 4096
  # 是否忽略模板中的水、岩浆和气泡柱；true 时保留目标世界原有液体方块。
  ignore_liquids: false
  # 忽略模板中的指定 Bukkit Material 方块；被忽略的位置保留目标世界原方块。
  ignore_blocks: []
  # 一个列表统一控制所有热恢复世界与各自区域。name 必须同时匹配已加载世界及
  # templates/<世界名>/region/；regions 留空时恢复模板中实际存在的全部区块，无需玩家在线。
  worlds:
    - name: "arena_world"
      regions:
        - {min_x: -4, max_x: 4, min_y: 0, max_y: 40, min_z: -4, max_z: 4}
        - {min_x: -32, max_x: 32, min_y: 32, max_y: 40, min_z: -4, max_z: 4}
    - name: "arena_nether"
      regions:
        - {min_x: -16, max_x: 16, min_y: 0, max_y: 80, min_z: -16, max_z: 16}

updates:
  # 启动时检查官方 GitHub Release。
  enabled: true
  auto-download: true

# 可编辑中文消息。
messages:
  prefix: "<color:#8A2387><bold>[</bold><color:#E62028><bold>WorldAreaReset</bold></color><color:#8A2387><bold>]</bold></color> <color:#555555><bold>»</bold></color> <color:#B9E7FF>"
  plugin_enabled: "<color:#55FF55>{prefix}<bold>WorldAreaReset v{version} 作者 {author} 已在 Paper/Folia 核心上成功启动。</color>"
  update_checking: "<color:#00D2FF>正在检查 WorldAreaReset 官方 GitHub Release 更新。</color>"
  update_latest: "<color:#55FF55>WorldAreaReset {version} 已经是最新版本。</color>"
  update_available: "<color:#FFFF55>发现 WorldAreaReset 新版本 {latest}，当前版本为 {current}。</color>"
  update_downloaded: "<color:#55FF55>WorldAreaReset {version} 已下载并通过 SHA-256 校验，将在服务器下次重启时安装。</color>"
  update_manual: "<color:#FFFF55>WorldAreaReset {version} 可用，请从官方 Releases 页面手动下载：{url}</color>"
  update_failed: "<color:#FF5555>WorldAreaReset 自动更新失败：{reason}。请从官方地址手动下载：{url}</color>"
  reload_success: "<color:#55FF55>{prefix}<bold>操作成功 > 配置文件已重载，清理任务已重新启动。</color>"
  manual_cleanup_started: "<color:#FFFF55>{prefix}<bold>清理已排程 > 倒计时已启动，自动清理计时器已重置为 {interval}</color>"
  manual_recreate_started: "<color:#FFFF55>{prefix}<bold>恢复已排程 > 倒计时已启动，自动恢复计时器已重置为 {interval}</color>"
  no_permission: "<color:#FF5555>{prefix}<bold>权限不足 > 你没有权限执行此命令。</color>"
  wrong_usage: "<color:#FF5555>{prefix}<bold>参数错误 > 未知指令，请使用 /war help。</color>"
  start_cleanup: "<color:#00D2FF>{prefix}<bold>清理进行中 > 正在清理世界 {world}，请稍候。</color>"
  start_restore: "<color:#00D2FF>{prefix}<bold>恢复进行中 > 正在恢复世界 {world}，请稍候。</color>"
  warning: |-
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold><strikethrough>---------<bold><strikethrough>---------<bold> ✧ <bold><strikethrough>---------<bold><strikethrough>---------</gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>⚠ 地形清理警告 ⚠</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>▪ 清理世界：{world}</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>▪ 将在 {time} 秒后开始清理。</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold><strikethrough>---------<bold><strikethrough>---------<bold> ✧ <bold><strikethrough>---------<bold><strikethrough>---------</gradient>
  restore_warning: |-
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold><strikethrough>---------<bold><strikethrough>---------<bold> ✧ <bold><strikethrough>---------<bold><strikethrough>---------</gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>⚠ 地形热恢复警告 ⚠</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>▪ 恢复世界：{world}</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>▪ 将在 {time} 秒后开始恢复。</bold></gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold><strikethrough>---------<bold><strikethrough>---------<bold> ✧ <bold><strikethrough>---------<bold><strikethrough>---------</gradient>
  finish_cleanup: |-
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold><strikethrough>---------<bold><strikethrough>---------<bold> ✧ <bold><strikethrough>---------<bold><strikethrough>---------</gradient>
    <gradient:#FFB7D5:#D7C7FF:#B9E7FF:#D7C7FF:#FFB7D5><bold>❖ 区域清理完成 ❖</bold></gradient>

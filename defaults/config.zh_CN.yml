      checking: "正在检查 WorldAreaReset 官方 GitHub 仓库更新..."
      latest: "WorldAreaReset {version} 已经是最新版本。"
      available: "发现新版本 WorldAreaReset {version}，当前版本为 {current}。"
      manual_download: "自动下载已关闭，请前往 {url} 手动下载。"
      downloaded: "WorldAreaReset {version} 已下载，将在下一次服务器重启时安装。"

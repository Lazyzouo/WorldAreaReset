plugins {
    id 'java'
}

def pluginName = 'WorldAreaReset'
def pluginVersion = '1.2.5'
def pluginAuthor = 'Lazyz'

group = 'net.lazyz'
version = pluginVersion

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [
            'pluginName': pluginName,
            'pluginVersion': pluginVersion,
            'pluginAuthor': pluginAuthor
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('jar') {
    enabled = false
}

def englishJar = tasks.register('englishJar', Jar) {
    archiveFileName = "${pluginName}-${pluginVersion}-en.us.jar"
    from(sourceSets.main.output) {
        exclude 'config.yml'
    }
    from('src/main/resources/config-en_US.yml') {
        rename { 'config.yml' }
    }
}

def chineseJar = tasks.register('chineseJar', Jar) {
    archiveFileName = "${pluginName}-${pluginVersion}-zh.cn.jar"
    from sourceSets.main.output
}

tasks.register('verifyLanguageJars') {
    dependsOn englishJar, chineseJar
    doLast {
        def variants = [
                (englishJar.get().archiveFile.get().asFile): file('src/main/resources/config-en_US.yml'),
                (chineseJar.get().archiveFile.get().asFile): file('src/main/resources/config.yml')
        ]

        variants.each { jarFile, expectedConfig ->
            def packagedConfig = zipTree(jarFile).matching { include 'config.yml' }.singleFile
            if (!Arrays.equals(packagedConfig.bytes, expectedConfig.bytes)) {
                throw new GradleException("${jarFile.name} does not contain the unchanged official ${expectedConfig.name}")
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn englishJar, chineseJar
}

tasks.named('check') {
    dependsOn tasks.named('verifyLanguageJars')
}
